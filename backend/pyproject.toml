[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: end-to-end tests that run the real pipeline (about 1-3 minutes)"]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
