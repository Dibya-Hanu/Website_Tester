<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">AI Universal Website Tester architecture</title><desc id="desc">A React URL-only dashboard drives a durable FastAPI queue. Safe scanners and local Ollama produce evidence through a DNS-pinned read-only guard. Verified findings and coverage-aware scores become one report.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7e9689"/></marker><style>text{font-family:system-ui,sans-serif;fill:#304d3f}.title{font-size:27px;font-weight:650;letter-spacing:-.5px}.eyebrow{font-size:10px;font-weight:600;letter-spacing:2px;fill:#769074}.h{font-size:16px;font-weight:600}.s{font-size:12px;fill:#718674}.box{fill:#fff;stroke:#d7e1d6;stroke-width:1.5}.line{fill:none;stroke:#8fa38e;stroke-width:1.5;marker-end:url(#arrow)}.ai{fill:#edf5e5;stroke:#b9cda5;stroke-width:1.5}.guard{fill:#214437;stroke:#214437}.light{fill:#e2edd5}.note{font-size:11px;fill:#849879}</style></defs>
<rect width="1200" height="830" fill="#f7f9f3" rx="18"/>
<text x="48" y="48" class="eyebrow">URL ONLY · LOCAL AI · AUTHORIZED TARGETS</text><text x="48" y="86" class="title">Real measurements. Local reasoning. One clear report.</text>
<rect x="48" y="126" width="270" height="110" rx="10" class="box"/><text x="70" y="159" class="h">React dashboard</text><text x="70" y="182" class="s">URL + pillar selection · live SSE</text><text x="70" y="203" class="s">Reports · evidence · exports · history</text>
<path d="M318 181H395" class="line"/><text x="331" y="169" class="note">REST</text>
<rect x="403" y="126" width="335" height="110" rx="10" class="box"/><text x="426" y="159" class="h">FastAPI + durable worker</text><text x="426" y="182" class="s">SQLite WAL jobs / events / reports</text><text x="426" y="203" class="s">Exact-origin allowlist · bounded queue</text>
<path d="M738 181H810" class="line"/>
<rect x="818" y="126" width="334" height="110" rx="10" class="ai"/><text x="841" y="159" class="h">Local Ollama</text><text x="841" y="182" class="s">Qwen text + Qwen vision · Apache-2.0</text><text x="841" y="203" class="s">No cloud fallback · no execution rights</text>
<path d="M565 236V288" class="line"/><path d="M985 236V282" class="line"/>
<rect x="48" y="294" width="690" height="205" rx="11" fill="#f0f4e9" stroke="#dbe5d2"/>
<text x="70" y="322" class="eyebrow">AUTOMATED TESTING ADAPTERS</text>
<rect x="70" y="339" width="315" height="61" rx="7" class="box"/><text x="88" y="363" class="h">Playwright</text><text x="88" y="383" class="s">Crawl, screenshots, safe forms and flows</text>
<rect x="404" y="339" width="313" height="61" rx="7" class="box"/><text x="423" y="363" class="h">ZAP + Nuclei + custom HTTP</text><text x="423" y="383" class="s">Passive baseline, inert probes, allowlist</text>
<rect x="70" y="417" width="315" height="61" rx="7" class="box"/><text x="88" y="441" class="h">Lighthouse + Locust</text><text x="88" y="461" class="s">Lab metrics · max 20 users / 30 seconds</text>
<rect x="404" y="417" width="313" height="61" rx="7" class="box"/><text x="423" y="441" class="h">axe-core + Pa11y</text><text x="423" y="461" class="s">DOM/WCAG checks · no invented INP</text>
<rect x="818" y="294" width="334" height="205" rx="10" class="ai"/><text x="841" y="323" class="eyebrow">MEANINGFUL, SCOPED AI WORK</text><text x="841" y="354" class="s">1. Classify known pages and user flows</text><text x="841" y="380" class="s">2. Generate schema-scoped form cases</text><text x="841" y="406" class="s">3. Triage re-tested security signals</text><text x="841" y="432" class="s">4. Review desktop/mobile screenshots</text><text x="841" y="458" class="s">5. Explain, deduplicate and suggest fixes</text><path d="M818 365H748" class="line"/>
<path d="M393 499V548" class="line"/><path d="M985 499V550" class="line"/>
<rect x="48" y="555" width="690" height="88" rx="10" class="guard"/><text x="71" y="584" class="h light">Mandatory per-job outbound guard</text><text x="71" y="609" class="s light">DNS pinning · one origin · mutation / redirect blocks · request and rate caps</text><text x="71" y="627" class="s light">Upstream TLS verified · secret values withheld · non-destructive checks</text>
<path d="M393 643V691" class="line"/>
<rect x="48" y="698" width="690" height="78" rx="10" class="box"/><text x="70" y="726" class="h">Owner / organizer-approved target</text><text x="70" y="750" class="s">Security and load refuse non-allowlisted origins. No account or transaction submits.</text>
<rect x="818" y="555" width="334" height="221" rx="10" class="box"/><text x="841" y="589" class="h">One evidence-based report</text><text x="841" y="617" class="s">Deterministic independent re-tests</text><text x="841" y="643" class="s">Verified / Possible + tool provenance</text><text x="841" y="669" class="s">Severity, location, evidence and fix</text><text x="841" y="695" class="s">Coverage-aware pillar / overall scores</text><text x="841" y="735" class="eyebrow">SELF-CONTAINED HTML · PDF · JSON</text>
<path d="M738 600H808" class="line"/><text x="49" y="807" class="note">MIT application · Open-source scanners and models · Partial / skipped coverage is explicit, never a fabricated pass.</text>
</svg>
